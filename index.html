<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Send Us a Photo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #f5f4f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem 4rem;
  }
  .page { width: 100%; max-width: 500px; }
  .brand { text-align: center; margin-bottom: 1.75rem; }
  .brand-icon {
    width: 60px; height: 60px;
    background: #1a1a2e;
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    box-shadow: 0 4px 20px rgba(26,26,46,0.18);
  }
  .brand h1 { font-size: 24px; font-weight: 600; color: #1a1a2e; }
  .brand p { font-size: 14px; color: #888; margin-top: 4px; }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 2rem;
    box-shadow: 0 2px 24px rgba(0,0,0,0.08);
  }
  .field { margin-bottom: 1.1rem; }
  .field label {
    display: block;
    font-size: 12px; font-weight: 600; color: #888;
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .field input, .field textarea {
    width: 100%;
    border: 1.5px solid #e8e8e8;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 15px;
    background: #fafafa; color: #1a1a2e;
    font-family: inherit; resize: vertical;
    transition: border-color 0.2s, background 0.2s;
    outline: none;
  }
  .field input:focus, .field textarea:focus {
    border-color: #4a6cf7; background: #fff;
    box-shadow: 0 0 0 3px rgba(74,108,247,0.1);
  }
  .upload-zone {
    border: 2px dashed #d0d0d0;
    border-radius: 14px; padding: 2.5rem 1rem;
    text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: #fafafa;
  }
  .upload-zone:hover, .upload-zone.drag {
    border-color: #4a6cf7;
    background: rgba(74,108,247,0.04);
  }
  .upload-zone svg { display: block; margin: 0 auto 10px; }
  .upload-zone p { font-size: 15px; color: #555; font-weight: 500; }
  .upload-zone span { font-size: 12px; color: #aaa; }
  .preview-wrap { position: relative; margin-top: 10px; }
  .preview-wrap img {
    width: 100%; max-height: 240px; object-fit: cover;
    border-radius: 12px; border: 1.5px solid #e8e8e8;
  }
  .remove-btn {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.55); color: #fff; border: none;
    border-radius: 50%; width: 30px; height: 30px;
    cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .submit-btn {
    width: 100%; padding: 14px;
    background: #1a1a2e; color: #fff;
    border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 0.75rem;
    transition: background 0.2s, transform 0.1s;
  }
  .submit-btn:hover:not(:disabled) { background: #2d2d50; }
  .submit-btn:active:not(:disabled) { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .status {
    border-radius: 10px; padding: 13px 16px;
    font-size: 14px; margin-top: 1rem;
    display: none; font-weight: 500;
  }
  .status.success { background: #eafaf1; color: #1a7a44; border: 1px solid #b0e8c8; display: block; }
  .status.error { background: #fef2f2; color: #c0392b; border: 1px solid #f5c6c6; display: block; }
  .spinner {
    width: 19px; height: 19px;
    border: 2.5px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .info-bar {
    background: #f0f4ff; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; color: #4a6cf7;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 1.25rem; font-weight: 500;
  }
  .success-screen { display: none; text-align: center; padding: 2rem 1rem; }
  .success-icon {
    width: 64px; height: 64px; background: #eafaf1;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; margin: 0 auto 1rem; font-size: 30px;
  }
  .success-screen h2 { font-size: 20px; color: #1a1a2e; margin-bottom: 8px; }
  .success-screen p { font-size: 14px; color: #888; line-height: 1.6; }
  .send-another {
    margin-top: 1.5rem; background: none;
    border: 1.5px solid #e0e0e0; border-radius: 10px;
    padding: 10px 24px; font-size: 14px; cursor: pointer;
    color: #555; font-family: inherit; font-weight: 500;
  }
  .send-another:hover { background: #f5f5f5; }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <div class="brand-icon">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <rect x="3" y="7" width="24" height="18" rx="3.5" stroke="white" stroke-width="1.8"/>
        <circle cx="15" cy="15.5" r="5" stroke="white" stroke-width="1.8"/>
        <rect x="10" y="4.5" width="10" height="4" rx="2" stroke="white" stroke-width="1.8"/>
      </svg>
    </div>
    <h1>Send Us a Photo</h1>
    <p>We'll review and get back to you</p>
  </div>

  <div class="card">
    <div id="formView">
      <div class="info-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        You will receive a Gmail notification
      </div>

      <div class="field">
        <label>Your name</label>
        <input type="text" id="name" placeholder="e.g. Ram Sharma" autocomplete="name" />
      </div>
      <div class="field">
        <label>Your email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Message (optional)</label>
        <textarea id="message" rows="3" placeholder="Describe your photo or add a note..."></textarea>
      </div>

      <div class="field">
        <label>Your photo</label>
        <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <rect x="3" y="7" width="30" height="24" rx="4" stroke="#bbb" stroke-width="2"/>
            <circle cx="18" cy="18" r="5" stroke="#bbb" stroke-width="2"/>
            <path d="M12 7V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v1" stroke="#bbb" stroke-width="2"/>
            <path d="M18 14v8M14 18l4-4 4 4" stroke="#4a6cf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p>Tap to choose a photo</p>
          <span>JPG, PNG, WEBP — max 5 MB</span>
        </div>
        <div class="preview-wrap" id="previewWrap" style="display:none">
          <img id="preview" src="" alt="Selected photo" />
          <button class="remove-btn" id="removeBtn" title="Remove">×</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none" />
      </div>

      <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        Send photo
      </button>
      <div class="status" id="status"></div>
    </div>

    <div class="success-screen" id="successView">
      <div class="success-icon">✅</div>
      <h2>Photo received!</h2>
      <p id="successMsg">Thanks! We've received your photo and will get back to you soon.</p>
      <button class="send-another" onclick="resetForm()">Send another photo</button>
    </div>
  </div>
</div>

<script>
  let selectedFile = null;
  let base64Data = null;

  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const preview = document.getElementById('preview');
  const previewWrap = document.getElementById('previewWrap');
  const removeBtn = document.getElementById('removeBtn');

  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) loadFile(e.target.files[0]);
  });

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  removeBtn.addEventListener('click', e => {
    e.stopPropagation();
    selectedFile = null; base64Data = null;
    fileInput.value = '';
    previewWrap.style.display = 'none';
    dropZone.style.display = '';
  });

  function loadFile(file) {
    if (file.size > 5 * 1024 * 1024) {
      showStatus('Photo must be under 5 MB.', 'error'); return;
    }
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = ev => {
      preview.src = ev.target.result;
      base64Data = ev.target.result.split(',')[1];
      dropZone.style.display = 'none';
      previewWrap.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }

  function showStatus(msg, type) {
    const s = document.getElementById('status');
    s.textContent = msg;
    s.className = 'status ' + type;
  }

  function resetForm() {
    document.getElementById('name').value = '';
    document.getElementById('email').value = '';
    document.getElementById('message').value = '';
    selectedFile = null; base64Data = null;
    fileInput.value = '';
    previewWrap.style.display = 'none';
    dropZone.style.display = '';
    document.getElementById('status').className = 'status';
    document.getElementById('formView').style.display = '';
    document.getElementById('successView').style.display = 'none';
  }

  async function handleSubmit() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const message = document.getElementById('message').value.trim();

    if (!name) { showStatus('Please enter your name.', 'error'); return; }
    if (!email || !email.includes('@')) { showStatus('Please enter a valid email.', 'error'); return; }
    if (!selectedFile) { showStatus('Please select a photo.', 'error'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div> Sending...';
    document.getElementById('status').className = 'status';

    const mediaType = selectedFile.type || 'image/jpeg';
    const now = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kathmandu' });

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: [
              { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64Data } },
              { type: 'text', text: `Customer photo submission:
Name: ${name}
Email: ${email}
Message: ${message || '(none)'}
File: ${selectedFile.name}
Time: ${now} (Nepal Time)

Send a Gmail email to my authenticated Gmail account with:
Subject: "📸 New photo from ${name}"
Body: Notify me about this submission. Include customer details and briefly describe the photo.
Reply with just: SENT` }
            ]
          }],
          mcp_servers: [{ type: 'url', url: 'https://gmailmcp.googleapis.com/mcp/v1', name: 'gmail-mcp' }]
        })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error?.message || 'Server error');

      document.getElementById('successMsg').textContent =
        'Thanks ' + name + '! We got your photo and will reply to ' + email + ' soon.';
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';

    } catch (err) {
      showStatus('Error: ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Send photo';
    }
  }
</script>
</body>
</html>
